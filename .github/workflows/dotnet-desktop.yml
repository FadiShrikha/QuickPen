name: .NET Core Desktop

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*' # Triggers automatic release when pushing tags like v1.0.0
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release] # Set to Release for public distribution

    runs-on: windows-latest

    env:
      Solution_Name: QuickPen.slnx

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore
      run: dotnet restore $env:Solution_Name

    - name: Build
      run: dotnet build $env:Solution_Name --no-restore --configuration ${{ matrix.configuration }}

    - name: Publish Single File
      run: dotnet publish QuickPen/QuickPen.csproj -c ${{ matrix.configuration }} -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

    - name: Zip Artifact
      if: startsWith(github.ref, 'refs/tags/')
      run: Compress-Archive -Path publish/* -DestinationPath QuickPen.zip

    - name: Create Release and Upload
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: QuickPen.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}